<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valorant Map Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#1e293b;border-bottom:1px solid #334155;flex-wrap:wrap;flex-shrink:0}
select,button{height:30px;padding:0 10px;border:1px solid #334155;border-radius:6px;background:#0f172a;color:#e2e8f0;font-size:12px;cursor:pointer}
button:hover{background:#1e293b}
button.active{background:#3b82f6;border-color:#3b82f6;color:#fff;font-weight:500}
.lbl{font-size:11px;color:#94a3b8;white-space:nowrap}
.main{display:flex;flex:1;overflow:hidden}
#canvas-wrap{flex:1;position:relative;overflow:hidden;background:#1a1a2e}
canvas{position:absolute;top:0;left:0}
#img-canvas{image-rendering:pixelated}
#player-canvas{cursor:crosshair}
.sidebar{width:230px;background:#1e293b;border-left:1px solid #334155;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.card{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px;font-size:12px}
.card h3{font-size:10px;font-weight:600;color:#64748b;margin-bottom:8px;text-transform:uppercase;letter-spacing:.8px}
.kill-item{padding:5px 4px;border-bottom:1px solid #1e293b;cursor:pointer;color:#94a3b8;font-size:11px;border-radius:4px}
.kill-item:hover{background:#1e293b;color:#e2e8f0}
.kill-item.sel{background:#1d3a5f;color:#60a5fa;font-weight:500}
.kill-item:last-child{border-bottom:none}
.legend-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:11px;color:#94a3b8}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.tip{position:fixed;background:#1e293b;border:1px solid #475569;border-radius:6px;padding:6px 10px;font-size:11px;pointer-events:none;display:none;z-index:999;max-width:180px;color:#e2e8f0;line-height:1.5}
.img-status{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:4px;font-size:10px;color:#f59e0b;pointer-events:none;z-index:10}
input[type=range]{accent-color:#3b82f6;width:70px}
</style>
</head>
<body>

<div class="toolbar">
  <span class="lbl">Map</span>
  <select id="mapSel"></select>
  <span class="lbl">Match</span>
  <select id="matchSel"></select>
  <span class="lbl">Round</span>
  <select id="roundSel"></select>
  <span class="lbl">Kill</span>
  <select id="killSel"></select>
  <div style="width:1px;height:20px;background:#334155;margin:0 4px"></div>
  <button id="btnView" class="active">View</button>
  <button id="btnHeat">Heatmap</button>
  <button id="btnPred">Predictions</button>
  <button id="btnDebug" style="background:#8b5cf6;border-color:#8b5cf6">Debug coords</button>
  <div style="width:1px;height:20px;background:#334155;margin:0 4px"></div>
  <span class="lbl">Map opacity</span>
  <input type="range" id="mapOpacity" min="0" max="100" value="80" step="1">
  <div style="width:1px;height:20px;background:#334155;margin:0 4px"></div>
  <span class="lbl">Prediction time</span>
  <select id="predictionTimeBucket">
    <option value="0-15">0-15s</option>
    <option value="15-30">15-30s</option>
  </select>
  <div style="flex:1"></div>
</div>

<div class="main">
  <div id="canvas-wrap">
    <div class="img-status" id="imgStatus" style="display:none">No map image — place Haven.png / Bind.png etc. in map_images/</div>
    <canvas id="img-canvas"></canvas>
    <canvas id="player-canvas"></canvas>
  </div>
  <div class="sidebar">
    <div class="card">
      <h3>Legend</h3>
      <div class="legend-row"><div class="dot" style="background:#3b82f6"></div>Blue team</div>
      <div class="legend-row"><div class="dot" style="background:#ef4444"></div>Red team</div>
      <div class="legend-row"><div class="dot" style="background:#3b82f6;border:2px solid #facc15"></div>Killer (team color + ★)</div>
      <div class="legend-row"><div class="dot" style="background:#888;opacity:.55;border:2px solid #ef4444"></div>Victim (dimmed + ✕)</div>
      <div class="legend-row"><span style="color:#94a3b8;font-size:14px;line-height:1">➜</span>Facing direction</div>
      <div class="legend-row" style="font-size:10px;color:#64748b;margin-top:4px">Agent icons load from<br><code style="color:#94a3b8">agent_icons/</code> folder</div>
    </div>
    <div class="card">
      <h3>Kill info</h3>
      <div id="kill-detail" style="color:#475569;font-size:11px;line-height:1.6">Select a kill above</div>
    </div>
    <div class="card">
      <h3>Kills this round</h3>
      <div id="kill-list"></div>
    </div>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
let RAW = {};
let MAPS = [];
let PREDICTIONS = {};
let predictionTimeBucket = '0-15';  // default to 0-15 seconds

async function loadRawFromDatabase() {
  const res = await fetch('/api/raw');
  if (!res.ok) throw new Error(`Failed to load match data: ${res.status}`);
  RAW = await res.json();
  MAPS = Object.keys(RAW);
  if (!MAPS.length) throw new Error('Database returned no supported map data.');
  if (!currentMap || !RAW[currentMap]) currentMap = MAPS[0];

  const matchIds = Object.keys(RAW[currentMap].matches || {});
  currentMatch = matchIds.length ? matchIds[0] : null;
}

async function loadPredictionsFromDatabase() {
  try {
    console.log('Loading predictions from database...');
    const res = await fetch('/api/predictions');
    if (!res.ok) throw new Error(`Failed to load predictions: ${res.status}`);
    PREDICTIONS = await res.json();
    console.log('Predictions loaded:', PREDICTIONS);
  } catch (err) {
    console.error('Error loading predictions:', err);
    PREDICTIONS = {};
  }
}

const AGENT_ABBR = {
  'Astra':'AS','Breach':'BR','Brimstone':'BI','Chamber':'CH','Clove':'CL',
  'Cypher':'CY','Deadlock':'DL','Fade':'FA','Gekko':'GK','Harbor':'HB',
  'Iso':'IS','Jett':'JE','KAY/O':'KO','KAYO':'KO','Killjoy':'KJ','Neon':'NE','Omen':'OM',
  'Phoenix':'PH','Raze':'RZ','Reyna':'RE','Sage':'SG','Skye':'SK',
  'Sova':'SO','Tejo':'TJ','Viper':'VI','Vyse':'VY','Waylay':'WL','Yoru':'YO',
  'Veto':'VT','Miks':'MI'
};

const MAP_CALIBRATION = {
  Bind:     { rotation: 90, offsetX: 0.51, offsetY: 0.55, scaleX: 0.95, scaleY: 1 },
  Split:    { rotation: 0,  offsetX: -0.535, offsetY: 0.565, scaleX: 1, scaleY: 1 },
  Breeze:   { rotation: 90,  offsetX: 0.29, offsetY: 0.29, scaleX: 1, scaleY: 1 },
  Fracture: { rotation: 90,  offsetX: 0.73, offsetY: 0.73, scaleX: 1, scaleY: 1 },
  Pearl:    { rotation: 90,  offsetX: 0.4, offsetY: 0.38, scaleX: 0.95, scaleY: 1 },
};

const MAP_SCALARS = {
  Bind:     { xMultiplier: 5.9e-05, xScalarToAdd: 0.576941, yMultiplier: -5.9e-05, yScalarToAdd: 0.967566 },
  Split:    { xMultiplier: 7.8e-05, xScalarToAdd: 0.842188, yMultiplier: -7.8e-05, yScalarToAdd: 0.697578 },
  Breeze:   { xMultiplier: 7.0e-05, xScalarToAdd: 0.465123, yMultiplier: -7.0e-05, yScalarToAdd: 0.833078 },
  Fracture: { xMultiplier: 7.8e-05, xScalarToAdd: 0.556952, yMultiplier: -7.8e-05, yScalarToAdd: 1.155886 },
  Pearl:    { xMultiplier: 7.8e-05, xScalarToAdd: 0.480469, yMultiplier: -7.8e-05, yScalarToAdd: 0.916016 },
};

let currentMap = null;
let currentMatch = null;
let currentRound = null;
let currentKillIdx = null;
let mode = 'view';
let mapImage = null;
let mapOpacity = 0.8;
let imageCache = {};

// Agent icon support
const AGENT_ICONS_FOLDER = 'agent_icons';
const agentIconCache = {}; // agentName -> HTMLImageElement | null

function loadAgentIcon(agentName) {
  if (agentName in agentIconCache) return;

  agentIconCache[agentName] = null;

  const img = new Image();

  const safe = agentName
    .trim()
    .replace(/\//g, '')
    .replace(/[^a-zA-Z0-9_-]/g, '');

  const safeLower = safe.toLowerCase();

  const paths = [
    `${AGENT_ICONS_FOLDER}/${safe}.png`,
    `${AGENT_ICONS_FOLDER}/${safe}.jpg`,
    `${AGENT_ICONS_FOLDER}/${safeLower}.png`,
    `${AGENT_ICONS_FOLDER}/${safeLower}.jpg`,
  ];

  let tried = 0;

  function tryNext() {
    if (tried >= paths.length) return;
    img.src = paths[tried++];
  }

  img.onload = () => {
    agentIconCache[agentName] = img;
    drawPlayers();
  };

  img.onerror = tryNext;
  tryNext();
}

function preloadAgentIcons() {
  const kills = getKills();
  kills.forEach(k => {
    k.p.forEach(p => loadAgentIcon(p.a));
    if (k.vic) loadAgentIcon(k.vic.a);
  });
}

const wrap = document.getElementById('canvas-wrap');
const ic = document.getElementById('img-canvas');
const pc = document.getElementById('player-canvas');
const ictx = ic.getContext('2d');
const pctx = pc.getContext('2d');
const tip = document.getElementById('tip');
const imgStatus = document.getElementById('imgStatus');

function abbr(a) { return AGENT_ABBR[a] || a.slice(0,2).toUpperCase(); }
function getMapData() {
  return RAW[currentMap] || { matches: {} };
}

function getMatches() {
  return Object.keys(getMapData().matches || {}).sort();
}

function getMatchData() {
  if (!currentMatch) return null;
  return getMapData().matches[currentMatch] || null;
}

function getRounds() {
  const matchData = getMatchData();
  if (!matchData) return [];
  return Object.keys(matchData.rounds || {}).map(Number).sort((a, b) => a - b);
}

function getKills() {
  const matchData = getMatchData();
  if (!matchData || currentRound === null) return [];
  return matchData.rounds[String(currentRound)] || [];
}

function getCalibration() {
  return MAP_CALIBRATION[currentMap] || { offsetX: 0, offsetY: 0, scaleX: 1, scaleY: 1 };
}

function applyRotation(nx, ny, rotation) {
  if (rotation === 90)  return [ny, 1 - nx];
  if (rotation === 180) return [1 - nx, 1 - ny];
  if (rotation === 270) return [1 - ny, nx];
  return [nx, ny];
}

function normalizePredictionCoordSpace(x, y) {
  if (x >= 0 && x <= 1 && y >= 0 && y <= 1) return [x, y];

  const scalars = MAP_SCALARS[currentMap];
  if (!scalars) return [x, y];

  const nx = scalars.xMultiplier * x + scalars.xScalarToAdd;
  const ny = scalars.yMultiplier * y + scalars.yScalarToAdd;
  return [nx, ny];
}

function toCanvas(x, y, coordType = 'raw') {
  const vp = getImageViewport();
  const cal = getCalibration();

  let nx = x;
  let ny = y;

  if (coordType === 'prediction') {
    [nx, ny] = normalizePredictionCoordSpace(nx, ny);
  }

  ny = 1 - ny;
  [nx, ny] = applyRotation(nx, ny, cal.rotation);
  nx = nx * cal.scaleX + cal.offsetX;
  ny = ny * cal.scaleY + cal.offsetY;

  return [
    vp.x + nx * vp.w,
    vp.y + ny * vp.h
  ];
}

function getFacingUnitVector(player) {
  if (player.r === null || player.r === undefined || Number.isNaN(Number(player.r))) {
    return null;
  }

  const EPS = 0.01;
  const angle = Number(player.r);
  const [sx, sy] = toCanvas(player.x, player.y);
  const [ex, ey] = toCanvas(
    player.x + Math.cos(angle) * EPS,
    player.y + Math.sin(angle) * EPS
  );

  const dx = ex - sx;
  const dy = ey - sy;
  const mag = Math.hypot(dx, dy);
  if (!mag || mag < 0.0001) return null;

  return [dx / mag, dy / mag];
}

function drawFacingArrow(player, cx, cy, radius, teamColor, isKiller) {
  const unit = getFacingUnitVector(player);
  if (!unit) return;

  const [ux, uy] = unit;
  const startOffset = radius + 2;
  const size = isKiller ? 10 : 8;
  const width = isKiller ? 5 : 4;

  const tipX = cx + ux * (startOffset + size);
  const tipY = cy + uy * (startOffset + size);

  const px = -uy;
  const py = ux;

  const leftX = cx + ux * startOffset + px * width;
  const leftY = cy + uy * startOffset + py * width;

  const rightX = cx + ux * startOffset - px * width;
  const rightY = cy + uy * startOffset - py * width;

  pctx.save();
  pctx.beginPath();
  pctx.moveTo(tipX, tipY);
  pctx.lineTo(leftX, leftY);
  pctx.lineTo(rightX, rightY);
  pctx.closePath();
  pctx.fillStyle = 'rgba(0,0,0,0.75)';
  pctx.fill();

  const shrink = 0.9;
  pctx.beginPath();
  pctx.moveTo(
    cx + ux * (startOffset + size * shrink),
    cy + uy * (startOffset + size * shrink)
  );
  pctx.lineTo(
    cx + ux * startOffset + px * (width * shrink),
    cy + uy * startOffset + py * (width * shrink)
  );
  pctx.lineTo(
    cx + ux * startOffset - px * (width * shrink),
    cy + uy * startOffset - py * (width * shrink)
  );
  pctx.closePath();
  pctx.fillStyle = teamColor;
  pctx.fill();
  pctx.restore();
}

function resize() {
  const r = wrap.getBoundingClientRect();
  ic.width = pc.width = r.width;
  ic.height = pc.height = r.height;
  drawMapImage();
  drawPlayers();
}

function loadMapImage(mapName) {
  if (imageCache[mapName] !== undefined) {
    mapImage = imageCache[mapName];
    drawMapImage();
    return;
  }
  const img = new Image();
  const paths = [
    `map_images/${mapName}.png`,
    `map_images/${mapName}.jpg`,
    `map_images/${mapName.toLowerCase()}.png`,
    `map_images/${mapName.toLowerCase()}.jpg`,
  ];
  let tried = 0;
  function tryNext() {
    if (tried >= paths.length) {
      imageCache[mapName] = null;
      mapImage = null;
      imgStatus.style.display = 'block';
      drawMapImage();
      return;
    }
    img.src = paths[tried++];
  }
  img.onload = () => {
    imageCache[mapName] = img;
    mapImage = img;
    imgStatus.style.display = 'none';
    drawMapImage();
    drawPlayers();
  };
  img.onerror = tryNext;
  tryNext();
}

function getImageViewport() {
  const pad = 24;
  const availW = ic.width - pad * 2;
  const availH = ic.height - pad * 2;

  if (!mapImage) {
    return { x: pad, y: pad, w: availW, h: availH };
  }

  const imgAspect = mapImage.width / mapImage.height;
  const boxAspect = availW / availH;

  let w, h, x, y;

  if (imgAspect > boxAspect) {
    w = availW;
    h = w / imgAspect;
    x = pad;
    y = pad + (availH - h) / 2;
  } else {
    h = availH;
    w = h * imgAspect;
    x = pad + (availW - w) / 2;
    y = pad;
  }

  return { x, y, w, h };
}

function drawMapImage() {
  ictx.clearRect(0, 0, ic.width, ic.height);
  ictx.fillStyle = '#0d1b2a';
  ictx.fillRect(0, 0, ic.width, ic.height);

  if (!mapImage) return;

  const vp = getImageViewport();

  ictx.save();
  ictx.globalAlpha = mapOpacity;
  ictx.drawImage(mapImage, vp.x, vp.y, vp.w, vp.h);
  ictx.restore();
}

function drawVictim(vic) {
  if (!vic) return;
  const [cx, cy] = toCanvas(vic.x, vic.y);
  const R = 9;
  const icon = agentIconCache[vic.a];
  const teamColor = vic.t === 'Blue' ? '#3b82f6' : vic.t === 'Red' ? '#ef4444' : '#888';

  pctx.beginPath();
  pctx.arc(cx, cy, R + 2, 0, Math.PI * 2);
  pctx.fillStyle = 'rgba(0,0,0,0.55)';
  pctx.fill();

  pctx.save();
  pctx.globalAlpha = 0.55;

  if (icon) {
    pctx.beginPath();
    pctx.arc(cx, cy, R + 1.5, 0, Math.PI * 2);
    pctx.strokeStyle = teamColor;
    pctx.lineWidth = 2;
    pctx.stroke();

    pctx.beginPath();
    pctx.arc(cx, cy, R, 0, Math.PI * 2);
    pctx.fillStyle = 'rgba(15,23,42,0.6)';
    pctx.fill();

    pctx.beginPath();
    pctx.arc(cx, cy, R, 0, Math.PI * 2);
    pctx.clip();
    pctx.drawImage(icon, cx - R, cy - R, R * 2, R * 2);
  } else {
    pctx.beginPath();
    pctx.arc(cx, cy, R, 0, Math.PI * 2);
    pctx.fillStyle = teamColor;
    pctx.fill();
    pctx.fillStyle = '#fff';
    pctx.font = 'bold 7px system-ui';
    pctx.textAlign = 'center';
    pctx.textBaseline = 'middle';
    pctx.fillText(abbr(vic.a), cx, cy);
  }

  pctx.restore();

  const bx = cx + R * 0.65, by = cy - R * 0.65;
  pctx.beginPath();
  pctx.arc(bx, by, R * 0.42, 0, Math.PI * 2);
  pctx.fillStyle = '#1e293b';
  pctx.fill();
  pctx.strokeStyle = '#ef4444';
  pctx.lineWidth = 1;
  pctx.stroke();
  pctx.font = `bold ${Math.max(7, Math.floor(R * 0.44))}px system-ui`;
  pctx.fillStyle = '#ef4444';
  pctx.textAlign = 'center';
  pctx.textBaseline = 'middle';
  pctx.fillText('✕', bx, by + 0.5);

  const tag = vic.n.length > 12 ? vic.n.slice(0, 11) + '…' : vic.n;
  pctx.font = '9px system-ui';
  pctx.textAlign = 'center';
  pctx.textBaseline = 'top';
  const tw = pctx.measureText(tag).width;
  pctx.fillStyle = 'rgba(0,0,0,0.7)';
  pctx.fillRect(cx - tw / 2 - 2, cy + R + 2, tw + 4, 13);
  pctx.globalAlpha = 0.55;
  pctx.fillStyle = teamColor;
  pctx.fillText(tag, cx, cy + R + 3);
  pctx.globalAlpha = 1;
}

function drawPredictionIcon(pred, cx, cy, R, opacity, teamColor) {
  const icon = agentIconCache[pred.agent];
  loadAgentIcon(pred.agent);

  pctx.beginPath();
  pctx.arc(cx, cy, R + 2, 0, Math.PI * 2);
  pctx.fillStyle = 'rgba(0,0,0,0.4)';
  pctx.fill();

  pctx.save();
  pctx.globalAlpha = opacity * 0.85;

  if (icon) {
    pctx.beginPath();
    pctx.arc(cx, cy, R + 1.5, 0, Math.PI * 2);
    pctx.strokeStyle = teamColor;
    pctx.lineWidth = 2;
    pctx.stroke();

    pctx.beginPath();
    pctx.arc(cx, cy, R, 0, Math.PI * 2);
    pctx.fillStyle = 'rgba(15,23,42,0.6)';
    pctx.fill();

    pctx.beginPath();
    pctx.arc(cx, cy, R, 0, Math.PI * 2);
    pctx.clip();
    pctx.drawImage(icon, cx - R, cy - R, R * 2, R * 2);
  } else {
    pctx.beginPath();
    pctx.arc(cx, cy, R, 0, Math.PI * 2);
    pctx.fillStyle = teamColor;
    pctx.fill();

    pctx.beginPath();
    pctx.arc(cx, cy, R + 1, 0, Math.PI * 2);
    pctx.strokeStyle = teamColor;
    pctx.lineWidth = 1.5;
    pctx.stroke();

    pctx.fillStyle = '#fff';
    pctx.font = 'bold 7px system-ui';
    pctx.textAlign = 'center';
    pctx.textBaseline = 'middle';
    pctx.fillText(abbr(pred.agent), cx, cy);
  }

  pctx.restore();

  const tag = pred.player.length > 12 ? pred.player.slice(0, 11) + '…' : pred.player;
  pctx.font = '9px system-ui';
  pctx.textAlign = 'center';
  pctx.textBaseline = 'top';
  pctx.globalAlpha = 0.8;
  const tw = pctx.measureText(tag).width;
  pctx.fillStyle = 'rgba(0,0,0,0.7)';
  pctx.fillRect(cx - tw / 2 - 2, cy + R + 2, tw + 4, 13);
  pctx.fillStyle = teamColor;
  pctx.fillText(tag, cx, cy + R + 3);
  pctx.globalAlpha = 1;
}

function drawPredictions() {
  pctx.clearRect(0, 0, pc.width, pc.height);

  if (!currentMap || !PREDICTIONS[currentMap]) return;
  const mapPreds = PREDICTIONS[currentMap].matches || {};
  if (!currentMatch || !mapPreds[currentMatch]) return;
  const matchPreds = mapPreds[currentMatch].rounds || {};
  if (currentRound === null || !matchPreds[String(currentRound)]) return;

  const roundPreds = matchPreds[String(currentRound)].buckets || {};
  const timeBucketPreds = roundPreds[predictionTimeBucket] || [];

  timeBucketPreds.forEach(p => {
    const [cx, cy] = toCanvas(p.x, p.y, 'prediction');
    const R = 9;
    const opacity = p.confidence || 0.7;
    const teamColor = p.team === 'Blue' ? '#3b82f6' : p.team === 'Red' ? '#ef4444' : '#888';
    drawPredictionIcon(p, cx, cy, R, opacity, teamColor);
  });

  pctx.font = '11px system-ui';
  pctx.fillStyle = 'rgba(255,255,255,0.7)';
  pctx.textAlign = 'left';
  pctx.textBaseline = 'top';
  pctx.fillStyle = 'rgba(0,0,0,0.5)';
  pctx.fillRect(8, 8, 320, 25);
  pctx.fillStyle = '#e2e8f0';
  pctx.fillText(`Round ${currentRound} Predictions: ${predictionTimeBucket}s (${timeBucketPreds.length} players shown)`, 12, 12);
}

function drawDebugCoords() {
  pctx.clearRect(0, 0, pc.width, pc.height);

  const debugPoints = [
    { x: 0.7688, y: 0.7688, label: 'ookiemaru (Neon)', color: '#fbbf24' },
    { x: 1.2688, y: 1.2688, label: 'clover (Sage)', color: '#60a5fa' },
    { x: 1.3688, y: 1.3688, label: 'Water (Brimstone)', color: '#ef4444' },
    { x: 1.4688, y: 1.4688, label: 'MasterMike (Phoenix)', color: '#8b5cf6' },
    { x: 1.5688, y: 1.5688, label: 'clover2 (Skye)', color: '#34d399' }
  ];

  debugPoints.forEach((p, idx) => {
    const [cx, cy] = toCanvas(p.x, p.y, 'prediction');
    const R = 16;

    pctx.beginPath();
    pctx.arc(cx, cy, R + 4, 0, Math.PI * 2);
    pctx.fillStyle = p.color + '33';
    pctx.fill();

    pctx.beginPath();
    pctx.arc(cx, cy, R, 0, Math.PI * 2);
    pctx.fillStyle = p.color;
    pctx.fill();

    pctx.beginPath();
    pctx.arc(cx, cy, R, 0, Math.PI * 2);
    pctx.strokeStyle = '#fff';
    pctx.lineWidth = 2;
    pctx.stroke();

    pctx.fillStyle = '#000';
    pctx.font = 'bold 14px system-ui';
    pctx.textAlign = 'center';
    pctx.textBaseline = 'middle';
    pctx.fillText(idx + 1, cx, cy);

    pctx.font = '10px system-ui';
    pctx.fillStyle = '#fff';
    pctx.textAlign = 'center';
    pctx.textBaseline = 'top';
    pctx.fillText(p.label, cx, cy + R + 12);

    pctx.font = '9px monospace';
    pctx.fillStyle = '#ccc';
    pctx.fillText(`(${p.x.toFixed(4)}, ${p.y.toFixed(4)})`, cx, cy + R + 24);
  });

  pctx.font = '14px system-ui';
  pctx.fillStyle = '#8b5cf6';
  pctx.textAlign = 'left';
  pctx.textBaseline = 'top';
  pctx.fillText('DEBUG: 5 Test Prediction Coordinates', 12, 12);
}

function drawPlayers() {
  pctx.clearRect(0, 0, pc.width, pc.height);
  const kills = getKills();
  if (!kills.length && mode !== 'pred' && mode !== 'debug') return;

  if (mode === 'heat') { drawHeatmap(kills); return; }
  if (mode === 'pred') { drawPredictions(); return; }
  if (mode === 'debug') { drawDebugCoords(); return; }

  const sel = currentKillIdx !== null ? kills[currentKillIdx] : null;
  const players = sel ? sel.p : kills.flatMap(k => k.p);
  const killerName = sel ? sel.k : null;

  if (sel) {
    drawVictim(sel.vic);
  } else {
    kills.forEach(k => drawVictim(k.vic));
  }

  players.forEach(p => {
    const [cx, cy] = toCanvas(p.x, p.y);
    const isKiller = p.n === killerName;
    const R = isKiller ? 11 : 9;
    const teamColor = p.t === 'Blue' ? '#3b82f6' : p.t === 'Red' ? '#ef4444' : '#888';
    const icon = agentIconCache[p.a];

    drawFacingArrow(p, cx, cy, R, teamColor, isKiller);

    pctx.beginPath();
    pctx.arc(cx, cy, R + 2, 0, Math.PI * 2);
    pctx.fillStyle = 'rgba(0,0,0,0.55)';
    pctx.fill();

    if (icon) {
      pctx.beginPath();
      pctx.arc(cx, cy, R + 1.5, 0, Math.PI * 2);
      pctx.strokeStyle = teamColor;
      pctx.lineWidth = isKiller ? 3.5 : 2;
      pctx.stroke();

      pctx.beginPath();
      pctx.arc(cx, cy, R, 0, Math.PI * 2);
      pctx.fillStyle = 'rgba(15,23,42,0.6)';
      pctx.fill();

      pctx.save();
      pctx.beginPath();
      pctx.arc(cx, cy, R, 0, Math.PI * 2);
      pctx.clip();
      pctx.drawImage(icon, cx - R, cy - R, R * 2, R * 2);
      pctx.restore();

      if (isKiller) {
        const bx = cx + R * 0.6, by = cy - R * 0.6;
        pctx.beginPath();
        pctx.arc(bx, by, R * 0.38, 0, Math.PI * 2);
        pctx.fillStyle = '#facc15';
        pctx.fill();
        pctx.fillStyle = '#1e293b';
        pctx.font = `bold ${Math.max(7, R * 0.4)}px system-ui`;
        pctx.textAlign = 'center';
        pctx.textBaseline = 'middle';
        pctx.fillText('★', bx, by + 1);
      }

    } else {
      pctx.beginPath();
      pctx.arc(cx, cy, R, 0, Math.PI * 2);
      pctx.fillStyle = teamColor;
      pctx.fill();

      pctx.beginPath();
      pctx.arc(cx, cy, R + 1, 0, Math.PI * 2);
      pctx.strokeStyle = teamColor;
      pctx.lineWidth = isKiller ? 3 : 1.5;
      pctx.stroke();

      if (isKiller) {
        const bx = cx + R * 0.6, by = cy - R * 0.6;
        pctx.beginPath();
        pctx.arc(bx, by, R * 0.38, 0, Math.PI * 2);
        pctx.fillStyle = '#facc15';
        pctx.fill();
        pctx.fillStyle = '#1e293b';
        pctx.font = `bold ${Math.max(7, R * 0.4)}px system-ui`;
        pctx.textAlign = 'center';
        pctx.textBaseline = 'middle';
        pctx.fillText('★', bx, by + 1);
      }

      pctx.fillStyle = '#fff';
      pctx.font = `bold 7px system-ui`;
      pctx.textAlign = 'center';
      pctx.textBaseline = 'middle';
      pctx.fillText(abbr(p.a), cx, cy);
    }

    const tag = p.n.length > 12 ? p.n.slice(0, 11) + '…' : p.n;
    pctx.font = '9px system-ui';
    pctx.textAlign = 'center';
    pctx.textBaseline = 'top';
    const tw = pctx.measureText(tag).width;
    pctx.fillStyle = 'rgba(0,0,0,0.7)';
    pctx.fillRect(cx - tw / 2 - 2, cy + R + 2, tw + 4, 13);
    pctx.fillStyle = isKiller ? '#facc15' : teamColor;
    pctx.fillText(tag, cx, cy + R + 3);
  });
}

function drawHeatmap(kills) {
  const W = pc.width, H = pc.height;
  const imgData = pctx.createImageData(W, H);
  const density = new Float32Array(W * H);
  const R = 20;
  kills.forEach(kill => {
    kill.p.forEach(p => {
      const [cx, cy] = toCanvas(p.x, p.y);
      for (let dy = -R; dy <= R; dy++) {
        for (let dx = -R; dx <= R; dx++) {
          const d2 = dx*dx + dy*dy;
          if (d2 > R*R) continue;
          const px = Math.floor(cx+dx), py = Math.floor(cy+dy);
          if (px < 0 || py < 0 || px >= W || py >= H) continue;
          density[py*W+px] += 1 - Math.sqrt(d2)/R;
        }
      }
    });
  });
  let maxD = 0;
  for (let i = 0; i < density.length; i++) if (density[i] > maxD) maxD = density[i];
  for (let i = 0; i < density.length; i++) {
    const v = maxD > 0 ? density[i]/maxD : 0;
    if (v < 0.02) continue;
    const idx = i*4;
    let r,g,b;
    if (v < 0.25) { r=0; g=Math.round(v*4*255); b=255; }
    else if (v < 0.5) { r=0; g=255; b=Math.round((1-(v-0.25)*4)*255); }
    else if (v < 0.75) { r=Math.round((v-0.5)*4*255); g=255; b=0; }
    else { r=255; g=Math.round((1-(v-0.75)*4)*255); b=0; }
    imgData.data[idx]=r; imgData.data[idx+1]=g; imgData.data[idx+2]=b; imgData.data[idx+3]=Math.round(v*210);
  }
  pctx.putImageData(imgData, 0, 0);
}

function updateKillList() {
  const kills = getKills();
  const list = document.getElementById('kill-list');
  list.innerHTML = '';
  kills.forEach((k, i) => {
    const d = document.createElement('div');
    d.className = 'kill-item' + (i === currentKillIdx ? ' sel' : '');
    d.textContent = `${(k.ms/1000).toFixed(1)}s  ${k.k} → ${k.v}${k.s?' ['+k.s+']':''}`;
    d.onclick = () => { currentKillIdx = i; updateKillList(); updateKillDetail(); drawPlayers(); };
    list.appendChild(d);
  });
}

function updateKillDetail() {
  const kills = getKills();
  const el = document.getElementById('kill-detail');
  if (currentKillIdx === null || !kills[currentKillIdx]) {
    el.innerHTML = '<span style="color:#475569">Select a kill above</span>'; return;
  }
  const k = kills[currentKillIdx];
  el.innerHTML = `<b style="color:#e2e8f0">${k.k}</b> <span style="color:#475569">→</span> <b style="color:#e2e8f0">${k.v}</b><br><span style="color:#64748b">Weapon:</span> ${k.w||'?'}<br><span style="color:#64748b">Site:</span> ${k.s||'?'}<br><span style="color:#64748b">Time:</span> ${(k.ms/1000).toFixed(1)}s<br><span style="color:#64748b">Players on screen:</span> ${k.p.length}`;
}

function populateMatches() {
  matchSel.innerHTML = '';
  const matchIds = getMatches();

  matchIds.forEach(matchId => {
    const o = document.createElement('option');
    o.value = matchId;
    o.textContent = matchId;
    matchSel.appendChild(o);
  });

  currentMatch = matchIds.length ? matchIds[0] : null;
  if (currentMatch) matchSel.value = currentMatch;

  populateRounds();
}

function populateRounds() {
  roundSel.innerHTML = '';
  const rounds = getRounds();

  rounds.forEach(r => {
    const o = document.createElement('option');
    o.value = r;
    o.textContent = `Round ${r}`;
    roundSel.appendChild(o);
  });

  currentRound = rounds.length ? rounds[0] : null;
  if (currentRound !== null) roundSel.value = currentRound;

  populateKills();
}

function populateKills() {
  killSel.innerHTML = '<option value="">All kills</option>';
  getKills().forEach((k, i) => {
    const o = document.createElement('option'); o.value = i;
    o.textContent = `${(k.ms/1000).toFixed(1)}s: ${k.k}→${k.v}`; killSel.appendChild(o);
  });
  currentKillIdx = null;
  preloadAgentIcons();
  updateKillList(); updateKillDetail(); drawPlayers();
}

const mapSel = document.getElementById('mapSel');
const matchSel = document.getElementById('matchSel');
const roundSel = document.getElementById('roundSel');
const killSel = document.getElementById('killSel');

function populateMapOptions() {
  mapSel.innerHTML = '';
  MAPS.forEach(m => {
    const o = document.createElement('option');
    o.value = m;
    o.textContent = m;
    mapSel.appendChild(o);
  });
  if (currentMap) mapSel.value = currentMap;
}

mapSel.onchange = () => {
  currentMap = mapSel.value;
  currentMatch = null;
  currentRound = null;
  currentKillIdx = null;
  imageCache = {};
  loadMapImage(currentMap);
  populateMatches();
};

matchSel.onchange = () => {
  currentMatch = matchSel.value;
  currentRound = null;
  currentKillIdx = null;
  populateRounds();
};

roundSel.onchange = () => {
  currentRound = Number(roundSel.value);
  currentKillIdx = null;
  populateKills();
};

killSel.onchange = () => {
  currentKillIdx = killSel.value === '' ? null : Number(killSel.value);
  updateKillList();
  updateKillDetail();
  drawPlayers();
};

document.getElementById('btnView').onclick = () => { mode='view'; setMode(); };
document.getElementById('btnHeat').onclick = () => { mode='heat'; setMode(); };
document.getElementById('btnPred').onclick = () => { mode='pred'; setMode(); };
document.getElementById('btnDebug').onclick = () => { mode='debug'; setMode(); };

document.getElementById('mapOpacity').oninput = function() {
  mapOpacity = this.value / 100;
  drawMapImage();
};

document.getElementById('predictionTimeBucket').onchange = function() {
  predictionTimeBucket = this.value;
  if (mode === 'pred') drawPlayers();
};

function setMode() {
  ['btnView','btnHeat','btnPred','btnDebug'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById({view:'btnView',heat:'btnHeat',pred:'btnPred',debug:'btnDebug'}[mode]).classList.add('active');
  drawPlayers();
}

pc.onmousemove = (e) => {
  if (mode !== 'view') return;
  const rect = pc.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const kills = getKills();
  const players = currentKillIdx !== null ? kills[currentKillIdx]?.p||[] : kills.flatMap(k=>k.p);
  const victims = currentKillIdx !== null
    ? (kills[currentKillIdx]?.vic ? [kills[currentKillIdx].vic] : [])
    : kills.map(k => k.vic).filter(Boolean);

  let found = null, isVic = false, minD = 14;
  players.forEach(p => {
    const [cx,cy] = toCanvas(p.x, p.y);
    const d = Math.hypot(cx-mx, cy-my);
    if (d < minD) { minD=d; found=p; isVic=false; }
  });
  victims.forEach(v => {
    const [cx,cy] = toCanvas(v.x, v.y);
    const d = Math.hypot(cx-mx, cy-my);
    if (d < minD) { minD=d; found=v; isVic=true; }
  });

  if (found) {
    tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-10)+'px';
    const deg = found.r === null || found.r === undefined || Number.isNaN(Number(found.r))
      ? 'Unknown'
      : ((Number(found.r) * 180 / Math.PI) % 360 + 360).toFixed(1) + '°';
    const statusLabel = isVic
      ? '<span style="color:#ef4444">☠ Victim</span>'
      : `<span style="color:${found.t==='Blue'?'#60a5fa':'#f87171'}">${found.t}</span>`;
    tip.innerHTML=`<b>${found.n}</b><br>${found.a} · ${statusLabel}<br><span style="color:#64748b">(${found.x.toFixed ? found.x.toFixed(4) : found.x}, ${found.y.toFixed ? found.y.toFixed(4) : found.y})</span>${isVic?'':('<br><span style="color:#64748b">Facing:</span> '+deg)}`;
  } else { tip.style.display='none'; }
};
pc.onmouseleave = () => { tip.style.display='none'; };

new ResizeObserver(resize).observe(wrap);
async function initializeApp() {
  try {
    await loadRawFromDatabase();
    await loadPredictionsFromDatabase();
    populateMapOptions();
    loadMapImage(currentMap);
    populateMatches();
    resize();
  } catch (err) {
    console.error(err);
    document.getElementById('kill-detail').innerHTML =
      `<span style="color:#f87171">${err.message}</span>`;
    document.getElementById('kill-list').innerHTML =
      '<div style="font-size:11px;color:#f87171">Could not load data from valorant.db</div>';
  }
}

window.addEventListener('load', initializeApp);
</script>
